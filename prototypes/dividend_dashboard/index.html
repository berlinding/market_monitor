<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>港股稳健红利现金流 · 监控面板</title>
<style>
  :root {
    --bg: #0e1117; --panel: #161b22; --panel2: #1c2129; --border: #2d333b;
    --text: #e6edf3; --muted: #8b949e; --accent: #3fb950;
    --red: #f85149; --yellow: #d29922; --orange: #db6d28; --blue: #58a6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 22px; line-height: 1.5; font-size: 14px;
  }
  .wrap { max-width: 1280px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
  h1 { font-size: 21px; font-weight: 650; }
  .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 18px; }
  .sub b { color: var(--text); }
  button { cursor: pointer; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 13px 16px; }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font-size: 25px; font-weight: 700; margin-top: 2px; }
  .card .v small { font-size: 13px; color: var(--muted); font-weight: 400; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .search { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; color: var(--text);
    padding: 8px 12px; width: 220px; font-size: 13.5px; outline: none; }
  .search:focus { border-color: var(--blue); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--panel); border: 1px solid var(--border); color: var(--muted); border-radius: 999px;
    padding: 5px 12px; font-size: 12.5px; transition: all .15s; }
  .chip:hover { color: var(--text); }
  .chip.active { background: var(--blue); color: #04121f; border-color: var(--blue); font-weight: 600; }
  .spacer { flex: 1; }
  .refresh { background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 7px 14px; font-size: 12.5px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 940px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .panel h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--muted); }
  .panel.wide { grid-column: 1 / -1; }
  canvas { max-height: 320px; }
  .legend { margin-top: 10px; color: var(--muted); font-size: 12px; }

  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 7px; text-align: right; white-space: nowrap; }
  th { color: var(--muted); font-weight: 550; border-bottom: 1px solid var(--border); user-select: none; }
  th.sortable { cursor: pointer; }
  th.sortable:hover { color: var(--text); }
  th .arr { font-size: 10px; }
  th:first-child, td:first-child { text-align: left; }
  tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; }
  tbody tr:hover td { background: rgba(255,255,255,0.03); }
  .pos { color: var(--accent); } .neg { color: var(--red); }
  .muted { color: var(--muted); font-size: 12px; }
  .flag { color: var(--red); font-size: 11px; }
  .bar { display: inline-block; height: 6px; border-radius: 3px; vertical-align: middle; background: var(--blue); }

  .detail td { background: var(--panel2) !important; cursor: default; text-align: left; padding: 12px 14px; }
  .subscores { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 18px; }
  .subs { display: flex; flex-direction: column; gap: 3px; }
  .subs .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .subs .track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .subs .fill { height: 100%; background: var(--blue); border-radius: 3px; }
  .dnote { margin-top: 10px; font-size: 12px; color: var(--muted); }

  footer { margin-top: 18px; color: var(--muted); font-size: 11.5px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📊 港股稳健红利现金流 · 监控面板</h1>
    <button class="refresh" onclick="location.reload()">↻ 刷新</button>
  </header>
  <div class="sub" id="meta">加载中…</div>

  <div class="cards" id="cards"></div>

  <div class="controls">
    <input class="search" id="search" placeholder="🔍 搜索股票名 / 代码…" oninput="renderTable()">
    <div class="chips" id="sectorChips"></div>
    <div class="spacer"></div>
    <div class="chips" id="tierChips"></div>
  </div>

  <div class="grid">
    <div class="panel"><h2>🏆 综合评分 Top 15</h2><canvas id="scoreChart"></canvas></div>
    <div class="panel"><h2>⚖️ 股息率 × 现金流覆盖率</h2><canvas id="scatterChart"></canvas>
      <div class="legend">X = TTM 股息率(%)，Y = 覆盖率（金融股为派息反推）。点越大市值越大。</div></div>
    <div class="panel wide"><h2>📈 评分历史趋势（Top 8）</h2><canvas id="historyChart"></canvas></div>
  </div>

  <div class="panel" style="margin-bottom:16px">
    <h2>📋 入选股票明细 <span class="muted" id="rowCount"></span></h2>
    <div class="tablewrap">
      <table id="stockTable">
        <thead>
          <tr>
            <th class="sortable" data-key="name" data-type="str">股票</th>
            <th data-key="sector" data-type="str">板块</th>
            <th class="sortable" data-key="ttm_yield" data-type="num">股息率%</th>
            <th class="sortable" data-key="payout_ratio" data-type="num">派息率</th>
            <th class="sortable" data-key="consecutive_years" data-type="num">连续年</th>
            <th class="sortable" data-key="coverage_ratio" data-type="num">覆盖率</th>
            <th class="sortable" data-key="pe" data-type="num">PE</th>
            <th class="sortable" data-key="pb" data-type="num">PB</th>
            <th class="sortable" data-key="roe" data-type="num">ROE%</th>
            <th class="sortable" data-key="market_cap_yi" data-type="num">市值(亿)</th>
            <th class="sortable" data-key="score" data-type="num">评分</th>
          </tr>
        </thead>
        <tbody id="stockBody"></tbody>
      </table>
    </div>
  </div>

  <div class="panel">
    <h2>👀 观察池（未通过筛选）<span class="muted" id="watchCount"></span></h2>
    <div class="tablewrap">
      <table>
        <thead><tr><th>股票</th><th>板块</th><th>股息率%</th><th>连续年</th><th>未通过原因</th></tr></thead>
        <tbody id="watchBody"></tbody>
      </table>
    </div>
  </div>

  <footer>数据源 Yahoo Finance · 仅作研究分析，不构成投资建议 · 生成于 <span id="genAt"></span></footer>
</div>

<script src="chart.umd.min.js"></script>
<script src="data/dashboard_data.js"></script>
<script>
const D = window.DASHBOARD_DATA;
const HIST = window.HISTORY || [];
const TIER_COLOR = { '优秀':'#3fb950', '稳健':'#d29922', '观察':'#db6d28', '关注':'#f85149' };
let activeSector = '全部', activeTier = '全部', sortKey = 'score', sortDir = -1;

function fmtNum(v, d=2){ return (v==null || isNaN(v)) ? '—' : Number(v).toFixed(d); }
function pct(v){ return v==null ? '—' : (v*100).toFixed(0)+'%'; }
function tierColor(t){ return TIER_COLOR[t] || '#8b949e'; }

function init() {
  if (!D || !D.stocks) { document.getElementById('meta').innerHTML = '<span style="color:#f85149">未找到数据，请先运行 pipeline.py</span>'; return; }
  const avgYield = D.stocks.reduce((s,x)=>s+(x.ttm_yield||0),0) / D.stocks.length;
  const top = D.stocks[0];
  document.getElementById('meta').innerHTML =
    `更新于 <b>${D.date}</b> · 候选池 <b>${D.universe_size}</b> 只 · 入选 <b>${D.passed}</b> 只 · 观察 <b>${D.near_miss}</b> 只`;
  document.getElementById('genAt').textContent = (D.generated_at||'').slice(0,16);
  document.getElementById('cards').innerHTML = [
    {k:'入选数量', v:D.passed},
    {k:'平均股息率', v: avgYield.toFixed(2)+'%'},
    {k:'最高评分', v: top ? top.score : '—'},
    {k:'评分第一', v: top ? top.name : '—'},
  ].map(c=>`<div class="card"><div class="k">${c.k}</div><div class="v">${c.v}</div></div>`).join('');

  buildChips();
  buildCharts();
  renderTable();
}

function buildChips() {
  const sectors = ['全部', ...new Set(D.stocks.map(s=>s.sector))];
  document.getElementById('sectorChips').innerHTML = sectors.map(s =>
    `<button class="chip ${s===activeSector?'active':''}" onclick="setSector('${s}')">${s}</button>`).join('');
  const tiers = ['全部','优秀','稳健','观察','关注'];
  document.getElementById('tierChips').innerHTML = tiers.map(t =>
    `<button class="chip ${t===activeTier?'active':''}" onclick="setTier('${t}')">${t}</button>`).join('');
}
function setSector(s){ activeSector = s; buildChips(); renderTable(); }
function setTier(t){ activeTier = t; buildChips(); renderTable(); }

function filtered() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  return D.stocks.filter(s => {
    if (activeSector !== '全部' && s.sector !== activeSector) return false;
    if (activeTier !== '全部' && s.tier !== activeTier) return false;
    if (q && !(s.name.toLowerCase().includes(q) || s.ticker.toLowerCase().includes(q))) return false;
    return true;
  });
}

function sortRows(rows) {
  const dir = sortDir;
  rows.sort((a,b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (sortKey === 'name') { va = a.name; vb = b.name; return va.localeCompare(vb,'zh') * dir; }
    if (va == null && vb == null) return 0;
    if (va == null) return 1; if (vb == null) return -1;
    return (va - vb) * dir;
  });
  return rows;
}

function renderTable() {
  const rows = sortRows(filtered());
  document.getElementById('rowCount').textContent = `（${rows.length} 只）`;
  const tbody = document.getElementById('stockBody');
  tbody.innerHTML = rows.map(s => {
    const cov = s.coverage_ratio != null ? s.coverage_ratio.toFixed(2) : '—';
    const flags = (s.flags||[]).length ? `<span class="flag">⚠${s.flags.join('/')}</span>` : '';
    const roe = s.roe != null ? s.roe.toFixed(1) : '—';
    const bar = `<span class="bar" style="width:${s.score}px;background:${tierColor(s.tier)}"></span>`;
    return `<tr onclick="toggleDetail('${s.ticker}')">
      <td>${s.tier_emoji} <b>${s.name}</b> <span class="muted">${s.ticker}</span> ${flags}</td>
      <td>${s.sector}</td>
      <td class="pos">${s.ttm_yield}%</td>
      <td>${pct(s.payout_ratio)}</td>
      <td>${s.consecutive_years}</td>
      <td>${cov}</td>
      <td>${s.pe ?? '—'}</td>
      <td>${s.pb ?? '—'}</td>
      <td>${roe}</td>
      <td>${s.market_cap_yi ?? '—'}</td>
      <td><b>${s.score}</b> ${bar}</td>
    </tr>
    <tr class="detail" id="detail-${s.ticker}" style="display:none"><td colspan="11">${detailHtml(s)}</td></tr>`;
  }).join('');
  renderWatch();
}

function detailHtml(s) {
  const sub = [
    ['股息吸引力', s.score_yield], ['派息持续性', s.score_consistency], ['现金流覆盖', s.score_coverage],
    ['财务稳健', s.score_quality], ['估值', s.score_valuation],
  ].map(([k,v])=>`<div class="subs"><div class="row"><span>${k}</span><span>${v}</span></div>
    <div class="track"><div class="fill" style="width:${v}%"></div></div></div>`).join('');
  const extra = [
    s.is_financial ? '金融股：覆盖率不适用，改用派息比率反推' : `覆盖率 ${fmtNum(s.coverage_ratio)}（${s.coverage_year||'—'}年）`,
    `近5年 FCF 为正 ${s.fcf_positive_years}/${s.fcf_window} 年`,
    `连续派息 ${s.consecutive_years} 年${s.dividend_cut_5y?'，⚠近5年有削减':''}`,
    `ROE ${fmtNum(s.roe)}% · 负债/权益 ${fmtNum(s.debt_to_equity)}`,
  ].join(' · ');
  return `<div class="subscores">${sub}</div>
    <div class="dnote">${extra}${(s.flags||[]).length ? `<br><span class="flag">⚠ 风险标记：${s.flags.join('；')}</span>` : ''}</div>`;
}
function toggleDetail(tk){ const el = document.getElementById('detail-'+tk); el.style.display = el.style.display==='none' ? '' : 'none'; }

function renderWatch() {
  document.getElementById('watchCount').textContent = `（${D.near_miss.length} 只，前30）`;
  document.getElementById('watchBody').innerHTML = D.near_miss.slice(0,30).map(s =>
    `<tr><td><b>${s.name}</b> <span class="muted">${s.ticker}</span></td>
     <td>${s.sector}</td><td>${s.ttm_yield ?? '—'}%</td><td>${s.consecutive_years}</td>
     <td class="neg">${(s.reasons||[]).join('；')}</td></tr>`).join('')
    || '<tr><td colspan="5" class="muted">无</td></tr>';
}

function buildCharts() {
  const top15 = D.stocks.slice(0,15);
  new Chart(document.getElementById('scoreChart'), {
    type: 'bar',
    data: { labels: top15.map(s=>s.name),
      datasets: [{ label:'综合评分', data: top15.map(s=>s.score),
        backgroundColor: top15.map(s=>tierColor(s.tier)), borderRadius: 4 }] },
    options: { indexAxis:'y', plugins:{legend:{display:false}},
      scales:{ x:{min:0,max:100,grid:{color:'#2d333b'}}, y:{grid:{display:false},ticks:{color:'#e6edf3'}} } }
  });

  const pts = D.stocks.map(s => ({ x: s.ttm_yield, y: s.coverage_ratio ?? s.payout_ratio,
    r: s.market_cap_yi ? Math.max(4, Math.min(16, Math.sqrt(s.market_cap_yi)/7)) : 6, name: s.name, ticker: s.ticker }));
  new Chart(document.getElementById('scatterChart'), {
    type:'bubble',
    data:{ datasets:[{ label:'股票', data: pts, backgroundColor:'rgba(88,166,255,0.55)' }] },
    options:{ plugins:{ legend:{display:false},
      tooltip:{ callbacks:{ label:(c)=>{ const p=pts[c.dataIndex]; return `${p.name}(${p.ticker}): 股息率 ${p.x}%, 覆盖 ${p.y}`; } } } },
      scales:{ x:{title:{display:true,text:'股息率%',color:'#8b949e'},grid:{color:'#2d333b'}},
               y:{title:{display:true,text:'覆盖率',color:'#8b949e'},grid:{color:'#2d333b'}} } }
  });

  // 历史趋势
  if (HIST.length >= 2) {
    const dates = HIST.map(h=>h.date);
    const latest = HIST[HIST.length-1].stocks;
    const topNames = latest.slice(0,8);
    const palette = ['#58a6ff','#3fb950','#d29922','#db6d28','#f85149','#bc8cff','#39c5cf','#e5533b'];
    const datasets = topNames.map((st,i)=>{
      const scores = HIST.map(h=>{ const r=(h.stocks||[]).find(x=>x.ticker===st.ticker); return r ? r.score : null; });
      return { label: st.name, data: scores, borderColor: palette[i], backgroundColor: palette[i],
        borderWidth: 2, pointRadius: 2.5, tension: 0.25, spanGaps: true };
    });
    new Chart(document.getElementById('historyChart'), {
      type:'line', data:{ labels: dates, datasets },
      options:{ plugins:{ legend:{ labels:{ color:'#8b949e', boxWidth:14 } } },
        scales:{ y:{ min:40, max:100, grid:{color:'#2d333b'}, ticks:{color:'#8b949e'} },
                 x:{ grid:{display:false}, ticks:{color:'#8b949e', maxTicksLimit:12 } } } }
    });
  } else {
    document.getElementById('historyChart').parentElement.innerHTML += '<div class="legend">历史数据积累中（需至少 2 天）</div>';
  }
}

// 表头排序
document.querySelectorAll('th.sortable').forEach(th=>{
  th.addEventListener('click', ()=>{
    const k = th.dataset.key;
    if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = -1; }
    document.querySelectorAll('th .arr').forEach(e=>e.textContent='');
    th.innerHTML = th.innerHTML.replace(/<span.*$/,'') + ` <span class="arr">${sortDir===1?'▲':'▼'}</span>`;
    renderTable();
  });
});

init();
</script>
</body>
</html>
